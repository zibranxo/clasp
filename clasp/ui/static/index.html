<!--
  CLASP web UI — Sprint 1 minimal build.

  Scope for this milestone: Providers panel ONLY (add/remove/save API keys).
  The full 6-panel app (Models, Dashboard, Routing, Advanced, Logs + live SSE
  stream) is built in Sprint 6 — see plan.md §15 and §20 step 71-73. This file
  is intentionally a subset so it's easy to extend later without a rewrite.
-->
<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950 text-gray-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLASP — Claude API Switching Proxy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script src="/ui/assets/app.js"></script>
  <link rel="stylesheet" href="/ui/assets/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            clasp: { green: '#4ade80', dark: '#030712' }
          }
        }
      }
    }
  </script>
</head>
<body class="h-full flex flex-col overflow-hidden" x-data="claspApp()" x-init="init()">

  <!-- ── Header ───────────────────────────────────────────────── -->
  <header class="shrink-0 flex items-center gap-3 px-5 py-3 bg-gray-900
                 border-b border-gray-800 z-10">
    <span class="font-mono font-bold text-green-400 text-xl tracking-tight">◆ CLASP</span>
    <span class="text-gray-600 text-sm font-mono" x-text="'v' + meta.version"></span>

    <div class="ml-auto flex items-center gap-3">
      <!-- Unsaved changes indicator -->
      <template x-if="dirty">
        <div class="flex items-center gap-2">
          <span class="text-yellow-400 text-sm animate-pulse">● Unsaved changes</span>
          <button @click="saveAndApply()"
                  :disabled="saving"
                  class="px-3 py-1.5 bg-green-600 hover:bg-green-500 disabled:opacity-50
                         rounded text-sm font-medium transition-colors">
            <span x-show="!saving">Save & Apply</span>
            <span x-show="saving">Saving…</span>
          </button>
          <button @click="discardChanges()"
                  class="px-3 py-1.5 text-gray-400 hover:text-white text-sm transition-colors">
            Discard
          </button>
        </div>
      </template>
    </div>
  </header>

  <!-- ── Body ─────────────────────────────────────────────────── -->
  <div class="flex flex-1 overflow-hidden">

    <main class="flex-1 overflow-y-auto bg-gray-950">

      <!-- Toast notification -->
      <template x-if="toast.show">
        <div class="fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg text-sm
                    transition-all duration-300"
             :class="toast.type === 'success'
                     ? 'bg-green-900 border border-green-700 text-green-200'
                     : 'bg-red-900 border border-red-700 text-red-200'"
             x-text="toast.message">
        </div>
      </template>

      <!-- ── Providers Panel ── -->
      <div class="p-6 max-w-4xl space-y-4">
        <div>
          <h1 class="text-xl font-semibold text-white">API Providers</h1>
          <p class="text-gray-500 text-sm mt-1">
            Add API keys for free-tier providers. CLASP routes across them to avoid rate limits.
          </p>
        </div>

        <template x-if="!Object.keys(config.providers ?? {}).length">
          <div class="text-gray-500 text-sm">Loading providers…</div>
        </template>

        <template x-for="(prov, name) in config.providers" :key="name">
          <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
            <!-- Card header -->
            <div class="flex items-center gap-3 px-5 py-4 cursor-pointer"
                 @click="prov._open = !prov._open">
              <div class="flex-1">
                <div class="flex items-center gap-2">
                  <span class="font-medium text-white"
                        x-text="catalog[name]?.display_name ?? name"></span>
                </div>
                <div class="text-xs text-gray-500 mt-0.5"
                     x-text="catalog[name]?.free_tier_note"></div>
              </div>
              <div class="flex items-center gap-2">
                <label class="flex items-center gap-2 cursor-pointer" @click.stop>
                  <input type="checkbox" x-model="prov.enabled" @change="markDirty()"
                         class="w-4 h-4 rounded accent-green-500">
                  <span class="text-sm text-gray-400"
                        x-text="prov.enabled ? 'Enabled' : 'Disabled'"></span>
                </label>
                <span class="text-gray-600 text-lg"
                      x-text="prov._open ? '▲' : '▼'"></span>
              </div>
            </div>

            <!-- Card body (collapsible) -->
            <div x-show="prov._open" x-collapse class="border-t border-gray-800 px-5 py-4 space-y-4">

              <!-- API Keys section -->
              <div>
                <div class="flex items-center justify-between mb-2">
                  <label class="text-sm font-medium text-gray-300">API Keys</label>
                  <button @click="addKey(name)"
                          class="text-xs text-green-400 hover:text-green-300 transition-colors">
                    + Add key
                  </button>
                </div>
                <div class="space-y-2">
                  <template x-for="(key, idx) in prov.keys" :key="idx">
                    <div class="flex items-center gap-2">
                      <div class="relative flex-1">
                        <input :type="key._reveal ? 'text' : 'password'"
                               x-model="key.value"
                               @input="markDirty()"
                               :placeholder="'Paste ' + (catalog[name]?.display_name ?? name) + ' API key'"
                               class="w-full bg-gray-800 border border-gray-700 rounded-lg
                                      px-3 py-2 pr-10 text-sm font-mono text-gray-200
                                      focus:outline-none focus:border-green-500
                                      placeholder-gray-600">
                        <button @click="key._reveal = !key._reveal"
                                class="absolute right-2 top-1/2 -translate-y-1/2
                                       text-gray-500 hover:text-gray-300 text-sm">
                          <span x-text="key._reveal ? '🙈' : '👁'"></span>
                        </button>
                      </div>
                      <button @click="removeKey(name, idx)"
                              class="text-gray-600 hover:text-red-400 transition-colors text-lg leading-none">
                        ×
                      </button>
                    </div>
                  </template>
                  <template x-if="!prov.keys.length">
                    <div class="text-xs text-gray-600">No keys added yet.</div>
                  </template>
                </div>
              </div>

              <!-- Catalog default (read-only reference, no override UI yet — Sprint 6) -->
              <div class="text-xs text-gray-600">
                Catalog default: <span x-text="catalog[name]?.rpm_limit"></span> RPM
              </div>
            </div>
          </div>
        </template>
      </div><!-- /providers panel -->

    </main>
  </div>
</body>
</html>
