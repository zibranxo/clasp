<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CLASP — Rate-limit-aware multi-provider proxy. KeyKing interface.">
  <title>CLASP — Key Management</title>

  <!-- Fonts - Exact KeyKing fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&family=Lexend:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS - Complete Neo-Brutalism design system -->
  <style>
    :root {
      --neo-bg: #fcf6e6;
      --neo-yellow: #fde047;
      --neo-green: #00e676;
      --neo-pink: #ff2a85;
      --neo-cyan: #00f0ff;
      --neo-purple: #9d4edd;
      --neo-orange: #ff6d00;
      --neo-dark: #000000;
      --neo-light: #ffffff;
      --neo-gray: #e5e7eb;

      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }

    body {
      font-family: var(--font-body);
      background: var(--neo-bg);
      color: var(--neo-dark);
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-display { font-family: var(--font-display); }
    .font-mono { font-family: var(--font-mono); }

    /* Neo-Brutalism Base Styles */
    .neo-card {
      background: var(--neo-light);
      border: 3px solid var(--neo-dark);
      box-shadow: 4px 4px 0px 0px var(--neo-dark);
      transition: all 0.2s ease;
    }

    .neo-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px 0px var(--neo-dark);
    }

    .neo-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem 1.5rem;
      background: var(--neo-light);
      border: 3px solid var(--neo-dark);
      box-shadow: 2px 2px 0px 0px var(--neo-dark);
      font-family: var(--font-display);
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .neo-button:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0px 0px var(--neo-dark);
    }

    .neo-button-primary { background: var(--neo-yellow); }
    .neo-button-success { background: var(--neo-green); }
    .neo-button-danger { background: var(--neo-pink); color: var(--neo-light); }
    .neo-button-info { background: var(--neo-cyan); }

    .neo-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.75rem;
      border: 3px solid var(--neo-dark);
      box-shadow: 2px 2px 0px 0px var(--neo-dark);
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .neo-badge-healthy { background: var(--neo-green); color: var(--neo-dark); }
    .neo-badge-warning { background: var(--neo-yellow); color: var(--neo-dark); }
    .neo-badge-info { background: var(--neo-cyan); color: var(--neo-dark); }
    .neo-badge-error { background: var(--neo-pink); color: var(--neo-light); }
    .neo-badge-off { background: var(--neo-gray); color: var(--neo-dark); }

    .neo-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--neo-light);
      border: 3px solid var(--neo-dark);
      box-shadow: 2px 2px 0px 0px var(--neo-dark);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--neo-dark);
      transition: all 0.2s ease;
    }

    .neo-input:focus {
      outline: none;
      background: var(--neo-yellow);
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0px 0px var(--neo-dark);
    }

    /* Layout */
    .neo-sidebar {
      width: 280px;
      background: var(--neo-light);
      border-right: 3px solid var(--neo-dark);
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      overflow-y: auto;
      z-index: 10;
    }

    .neo-main {
      margin-left: 280px;
      padding: 2rem;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }
    ::-webkit-scrollbar-track {
      background: var(--neo-bg);
      border-left: 3px solid var(--neo-dark);
    }
    ::-webkit-scrollbar-thumb {
      background-color: var(--neo-yellow);
      border: 3px solid var(--neo-dark);
    }
    ::-webkit-scrollbar-thumb:hover {
      background-color: var(--neo-pink);
    }

    /* Animations */
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }

    /* Hide Alpine elements until ready */
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="font-body">
  <!-- Exact KeyKing Replica Structure -->
  <div x-data="claspApp()" x-init="init()" x-cloak>
    <!-- App Structure Will Be Built Here -->

    <div class="flex">
      <!-- Sidebar -->
      <aside class="neo-sidebar">
        <div class="p-6 flex items-center gap-3 border-b-3 border-neo-dark bg-white">
          <div class="w-10 h-10 bg-neo-yellow flex items-center justify-center border-3 border-neo-dark">
            <span class="font-display font-black text-2xl">◆</span>
          </div>
          <h1 class="font-display font-black text-2xl text-neo-dark tracking-tight uppercase">CLASP</h1>
        </div>

        <nav class="flex-1 px-4 py-6 space-y-3 font-display uppercase font-bold text-sm">
          <template x-for="item in nav" :key="item.id">
            <button
              class="neo-button w-full text-left justify-start"
              :class="{ 'bg-neo-yellow border-neo-dark shadow-[4px_4px_0px_0px_#000] -translate-x-1 -translate-y-1': panel === item.id }"
              @click="panel = item.id"
            >
              <span x-text="item.icon"></span>
              <span x-text="item.label"></span>
            </button>
          </template>
        </nav>

        <div class="p-5 m-4 bg-neo-green border-3 border-neo-dark">
          <div class="flex items-center gap-3 mb-3">
            <div class="relative">
              <div class="w-3 h-3 bg-white border-2 border-neo-dark relative z-10"></div>
              <div class="w-3 h-3 bg-white absolute inset-0 animate-ping opacity-75"></div>
            </div>
            <span class="text-xs font-display font-black text-neo-dark tracking-wide uppercase">Proxy Active</span>
          </div>
          <div class="text-sm text-neo-dark font-black font-display">
            <span x-text="live.requests_today?.toLocaleString() || '0'"></span>
            <span class="text-xs uppercase bg-white border border-neo-dark px-1 ml-2">REQ TODAY</span>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="neo-main flex-1">
        <div class="max-w-6xl mx-auto animate-fade-in">
          <!-- Panels Will Be Loaded Here -->

          <!-- Providers Panel (Default View) -->
          <div x-show="panel === 'providers'">
            <div class="mb-8">
              <h1 class="font-display font-black uppercase text-4xl mb-2 tracking-tighter">API Providers</h1>
              <p class="text-neo-dark/80 font-bold text-sm">Manage and test your provider API keys.</p>
            </div>

            <!-- Provider Cards Will Be Added Here -->
            <div class="space-y-4">
              <!-- Provider card template -->
              <template x-for="(prov, name) in config.providers" :key="name">
                <div class="neo-card p-6 mb-6">
                  <div class="flex items-center justify-between mb-4 border-b-3 border-neo-dark pb-4">
                    <div class="flex-1">
                      <span class="font-display font-black uppercase text-2xl tracking-tighter" x-text="catalog[name]?.display_name ?? name"></span>
                      <span class="neo-badge" :class="providerStatusClass(name)" x-text="providerStatusText(name)"></span>
                    </div>
                    <div class="flex items-center gap-4">
                      <label class="flex items-center gap-2 cursor-pointer">
                        <span class="relative inline-block w-12 h-6 border-3 border-neo-dark bg-white">
                          <input type="checkbox" class="sr-only" x-model="prov.enabled" @change="markDirty()">
                          <span class="absolute top-0.5 left-0.5 w-4 h-4 bg-neo-dark transition-all" :class="{ 'translate-x-6 bg-neo-green': prov.enabled }"></span>
                        </span>
                        <span class="font-display font-bold text-sm uppercase" x-text="prov.enabled ? 'Enabled' : 'Disabled'"></span>
                      </label>
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" @click="prov._open = !prov._open">
                        <path d="M6 9l6 6 6-6"></path>
                      </svg>
                    </div>
                  </div>

                  <div x-show="prov._open" x-collapse>
                    <!-- Provider keys will be added here -->
                    <div class="space-y-3">
                      <template x-for="(key, idx) in prov.keys" :key="idx">
                        <div class="flex items-center gap-3">
                          <input class="neo-input flex-1" :type="key._reveal ? 'text' : 'password'" x-model="key.value" @input="markDirty()">
                          <button class="neo-button neo-button-info" @click="testKey(name, key.value, idx)" :disabled="!key.value || key._testing">
                            <span x-show="!key._testing">Test</span>
                            <span x-show="key._testing">…</span>
                          </button>
                          <button class="neo-button neo-button-danger" @click="removeKey(name, idx)">×</button>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Alpine.js -->
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
  <script src="/ui/assets/app_exact_replica.js"></script>
</body>
</html>
