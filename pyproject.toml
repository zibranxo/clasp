[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clasp"
version = "0.1.0"
description = "CLASP — Claude API Switching Proxy: rate-limit-aware multi-provider local proxy for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "ruamel.yaml>=0.18",
    "tiktoken>=0.8",
    "loguru>=0.7",
    "rich>=13.9",
    "aiosqlite>=0.20",
    "watchfiles>=0.24",
    "typer>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "ty>=0.0.1a1",
]
semantic = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
]

[project.scripts]
clasp = "clasp.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["clasp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]