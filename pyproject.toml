[project]
name = "clasp"
version = "0.1.0"
description = "Claude API Switching Proxy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.137.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.1",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "tiktoken>=0.13.0",
    "typer[all]>=0.26.7",
    "uvicorn[standard]>=0.49.0",
    "watchfiles>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
    "ty>=0.0.49",
]
[
project.scripts
]
clasp = "clasp.cli.main:app"
[
build-system
]
requires = ["hatchling"]
build-backend = "hatchling.build"